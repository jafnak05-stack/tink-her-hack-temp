<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Match Website</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
}

@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.container {
    min-height: 95vh;
    margin: 20px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    overflow: hidden;
}

.search-bar {
    display: flex;
    align-items: center;
    padding: 15px;
    background: rgba(255,255,255,0.3);
}

.search-bar input {
    flex: 1;
    padding: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    border-radius: 10px;
}

.search-bar i {
    font-size: 22px;
    margin: 0 10px;
    color: #333;
}

.content {
    flex: 1;
    padding: 20px;
    text-align: center;
    color: #333;
}

.content h2 {
    color: #fff;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
}

.content img {
    max-width: 90%;
    border-radius: 15px;
    margin-top: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.3s;
}

.content img:hover {
    transform: scale(1.05);
}

.upload-menu {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border-radius: 15px;
    padding: 15px;
    display: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.upload-menu button {
    display: block;
    width: 180px;
    padding: 10px;
    margin: 8px 0;
    border: none;
    background: linear-gradient(45deg, #ff758c, #ff7eb3);
    color: white;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
}

.bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 18px 0;
    background: rgba(255,255,255,0.3);
}

.bottom-nav i {
    font-size: 34px;
    cursor: pointer;
    color: #fff;
    transition: 0.3s;
}

.bottom-nav i:hover {
    transform: scale(1.2);
    color: yellow;
}
</style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="text" placeholder="Search colors...">
        <i class="fa fa-ellipsis-vertical"></i>
    </div>

    <!-- Content -->
    <div class="content">
        <h2>🎨 Color Match Website</h2>
        <p>Select an image to match colors beautifully!</p>
        <img id="preview" onclick="goNextPage()">
    </div>

    <!-- Upload Options -->
    <div class="upload-menu" id="uploadMenu">
        <button onclick="openCamera()">📷 Open Camera</button>
        <button onclick="openGallery()">🖼 Upload Image</button>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <input type="file" id="galleryInput" accept="image/*" hidden>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <i class="fa fa-home"></i>
        <i class="fa fa-plus-circle" onclick="toggleMenu()"></i>
        <i class="fa fa-heart"></i>
    </div>

</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("uploadMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function openCamera() {
    document.getElementById("cameraInput").click();
}

function openGallery() {
    document.getElementById("galleryInput").click();
}

/* Preview image and store in localStorage */
function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = document.getElementById("preview");
            img.src = e.target.result;
            localStorage.setItem('selectedImage', e.target.result);
            // Automatically go to next page after selection
            window.location.href = "image_view.html";
        }
        reader.readAsDataURL(file);
    }
}

document.getElementById("cameraInput").addEventListener("change", previewImage);
document.getElementById("galleryInput").addEventListener("change", previewImage);

/* Go to next page if image clicked */
function goNextPage() {
    const img = document.getElementById("preview");
    if(img.src){
        window.location.href = "image_view.html";
    } else {
        alert("Please select an image first!");
    }
}

/* Load previously selected image if exists */
window.onload = function(){
    const saved = localStorage.getItem('selectedImage');
    if(saved){
        document.getElementById('preview').src = saved;
    }
}
</script>

</body>
</html>
